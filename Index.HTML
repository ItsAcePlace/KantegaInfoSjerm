<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoSkjerm</title>
    <link rel="stylesheet" href="Styles.CSS">
</head>
<body id="backImg">
    <div id="cardHolder">
        <div class="card" id="clockDiv">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
        <div class="card" id="weatherDiv">
            <p>Weather</p>
            <table>
                <tr>
                    <th id="1time"></th>
                    <th id="2time"></th>
                    <th id="3time"></th>
                    <th id="4time"></th>
                    <th id="5time"></th>
                    <th id="6time"></th>
                </tr>
                <tr>
                    <th id="1weatherSymbol"></th>
                    <th id="2weatherSymbol"></th>
                    <th id="3weatherSymbol"></th>
                    <th id="4weatherSymbol"></th>
                    <th id="5weatherSymbol"></th>
                    <th id="6weatherSymbol"></th>
                </tr>
                <tr>
                    <th id="1temperature"></th>
                    <th id="2temperature"></th>
                    <th id="3temperature"></th>
                    <th id="4temperature"></th>
                    <th id="5temperature"></th>
                    <th id="6temperature"></th>
                </tr>
            </table>
        </div>
        <div class="card" id="bussDiv">
            <div class="primary">
                <p class="boardTitle" id="primaryStopName"></p>
                <table id="primaryTable">
                    <tr>
                        <th>Line Nr.</th>
                        <th>Line Name</th>
                        <th>Departs</th>
                    </tr>
                    <tr>
                        <th id="primary0busNr"></th>
                        <th id="primary0busName"></th>
                        <th id="primary0busDepart"></th>
                    </tr>
                    <tr>
                        <th id="primary1busNr"></th>
                        <th id="primary1busName"></th>
                        <th id="primary1busDepart"></th>
                    </tr>
                    <tr>
                        <th id="primary2busNr"></th>
                        <th id="primary2busName"></th>
                        <th id="primary2busDepart"></th>
                    </tr>
                    <tr>
                        <th id="primary3busNr"></th>
                        <th id="primary3busName"></th>
                        <th id="primary3busDepart"></th>
                    </tr>
                    <tr>
                        <th id="primary4busNr"></th>
                        <th id="primary4busName"></th>
                        <th id="primary4busDepart"></th>
                    </tr>
                </table>
            </div>
            <hr>
            <div class="seccondary">
                <p class="boardTitle" id="seccondaryStopName"></p>
                <table id="seccondaryTable">
                    <tr>
                        <th>Line Nr.</th>
                        <th>Line Name</th>
                        <th>Departs</th>
                    </tr>
                    <tr>
                        <th id="seccondary0busNr"></th>
                        <th id="seccondary0busName"></th>
                        <th id="seccondary0busDepart"></th>
                    </tr>
                    <tr>
                        <th id="seccondary1busNr"></th>
                        <th id="seccondary1busName"></th>
                        <th id="seccondary1busDepart"></th>
                    </tr>
                    <tr>
                        <th id="seccondary2busNr"></th>
                        <th id="seccondary2busName"></th>
                        <th id="seccondary2busDepart"></th>
                    </tr>
                    <tr>
                        <th id="seccondary3busNr"></th>
                        <th id="seccondary3busName"></th>
                        <th id="seccondary3busDepart"></th>
                    </tr>
                    <tr>
                        <th id="seccondary4busNr"></th>
                        <th id="seccondary4busName"></th>
                        <th id="seccondary4busDepart"></th>
                    </tr>
                </table>
            </div>
        </div>
        <div class="noCard" id="extraDiv">
            <p></p>
        </div>
    </div>
    <script src="Script.JS"></script>
</body>
</html>
