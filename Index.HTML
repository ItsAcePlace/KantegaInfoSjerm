<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoSkjerm</title>
    <link rel="stylesheet" href="Styles.CSS">
</head>
<body id="backImg">
    <div id="cardHolder">
        <div class="card" id="clockDiv">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
        <div class="card" id="weatherDiv">
            <p>Weather</p>
            <table>
                <tr>
                    <th id="1time"></th>
                    <th id="2time"></th>
                    <th id="3time"></th>
                    <th id="4time"></th>
                    <th id="5time"></th>
                    <th id="6time"></th>
                </tr>
                <tr>
                    <th id="1weatherSymbol"></th>
                    <th id="2weatherSymbol"></th>
                    <th id="3weatherSymbol"></th>
                    <th id="4weatherSymbol"></th>
                    <th id="5weatherSymbol"></th>
                    <th id="6weatherSymbol"></th>
                </tr>
                <tr>
                    <th id="1temperature"></th>
                    <th id="2temperature"></th>
                    <th id="3temperature"></th>
                    <th id="4temperature"></th>
                    <th id="5temperature"></th>
                    <th id="6temperature"></th>
                </tr>
            </table>
        </div>
        <div class="card" id="bussDiv">
            <div class="bus-board">
                <h2 id="bus-title">Bus departures</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Line</th>
                            <th>Destination</th>
                            <th>Departs</th>
                        </tr>
                    </thead>
                    <tbody id="bus-table"></tbody>
                </table>
            </div>
            <hr>
            <div class="bus-board">
                <h2 id="bus-title-secondary">Bus departures</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Line</th>
                            <th>Destination</th>
                            <th>Departs</th>
                        </tr>
                    </thead>
                    <tbody id="bus-table-secondary"></tbody>
                </table>
            </div>
        </div>
        <div class="noCard" id="extraDiv">
            <p></p>
        </div>
    </div>
    <script src="Script.JS"></script>
</body>
</html>
