<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoSkjerm</title>
    <link rel="stylesheet" href="Styles.CSS">
</head>
<body id="backImg">
    <div id="cardHolder">
        <div class="card" id="clockDiv">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
        <div class="card" id="weatherDiv">
            <p>Weather</p>
            <div id="time"></div>
            <div id="weatherSymbol"></div>
            <div id="temperature"></div>
        </div>
        <div class="card" id="bussDiv">
            <div class="bus-board">
                <h2 id="bus-title">Bus departures</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Line</th>
                            <th>Destination</th>
                            <th>Departs</th>
                        </tr>
                    </thead>
                    <tbody id="bus-table"></tbody>
                </table>
            </div>
            <hr>
            <div class="bus-board">
                <h2 id="bus-title-secondary">Bus departures</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Line</th>
                            <th>Destination</th>
                            <th>Departs</th>
                        </tr>
                    </thead>
                    <tbody id="bus-table-secondary"></tbody>
                </table>
            </div>
        </div>
        <div class="noCard" id="extraDiv">
            <p></p>
        </div>
    </div>
    <script src="Script.JS"></script>
</body>
</html>
